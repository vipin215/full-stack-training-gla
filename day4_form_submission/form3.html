<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>IIT JEE Registration form</legend>
            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="enter your name">
            <br>
            <br>
            <label for="mail">Email:</label>
            <input type="email" id="mail" placeholder="enter your email">
            <br><br>
            <label for="phone">Phone:</label>
            <input type="number" id="phone" placeholder="enter the number">
            <br><br>
            <label for="pass">Passward:</label>
            <input type="password" id="pass">
            <br><br>
           <label for="gender">Gender:</label>
           <input type="radio" id="male" name="gender">
           <label for="male">Male</label>
           <input type="radio" id="female" name="gender">
           <label for="female">Female</label>
           <input type="radio" id="other" name="gender">
           <label for="other">Others</label>
           <br><br>
           <label for="dob">Date of birth:</label>
           <input type="Date" id="dob">
           <br><br>
           <label for="School">School Name:</label>
           <input type="text" id="School" placeholder="enter your school">
           <br><br>
           <label for="board">Board:</label>
           <select>
            <option value="CBSE">CBSE</option>
            <option value="ICSC">ICSC</option>
            <option value="UPB">UPB</option>
            <option value="HARYANA BOARD">HARYANA BOARD</option>
           </select>
           <br><br>
           <label for="year">Year of passing:</label>
           <input type="number" id="year" min="2023" max="2026">
           <br><br>
           <label for="center">Exam-Center:</label>
           <select>
            <option value="" disabled selected>Select Center</option>
            <option value="delhi">Delhi</option>
            <option value="goa">Goa</option>
            <option value="Mathura">Mathura</option>
           </select>
           <br><br>
           <button>Register</button>
        </fieldset>
    </form>
</body>
</html>
